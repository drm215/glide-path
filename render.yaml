# Render Blueprint for the Glide Path API.
# The database is a free Neon Postgres project (neon.com), not a Render database:
# Render deletes free databases after 30 days, while Neon's free tier is permanent.
# The iPhone app itself is built with EAS (see eas.json), not on Render.
services:
  - name: glide-path-api
    type: web
    runtime: node
    # Free instances sleep after 15 minutes idle, so the first request after a quiet spell is slow.
    # Move to a paid plan once the website is public.
    plan: free
    region: virginia
    # Only changes under server/ trigger a deploy; docs and tests there don't change the running API.
    rootDir: server
    buildFilter:
      ignoredPaths:
        - "server/**/*.md"
        - "server/test/**"
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      # Neon connection string (Neon dashboard → Connect). Render asks for it when the Blueprint is created.
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
